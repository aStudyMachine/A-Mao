# ========== 服务基础 ==========
server:
  # HTTP 监听端口（user-service 对外 9101）
  port: 9101

spring:
  application:
    # 应用名：Feign 直连 name、Redisson clientName、日志标识共用
    name: user-service
  config:
    # 可选拉取 Nacos 共享配置；Nacos 不可用时不阻断启动（本期未接注册中心）
    import: "optional:nacos:user-service.yaml"
  mvc:
    format:
      # 全局日期时间序列化格式（Controller 出入参）
      date-time: yyyy-MM-dd HH:mm:ss

  # ========== Nacos（注册/配置中心；gRPC 端口 = server-addr 端口 + 1000，须与 compose 映射一致） ==========
  cloud:
    nacos:
      # 宿主端口 18848 避开 Windows Hyper-V 保留区间（见 docker/docker-compose.yml 注释）
      server-addr: 127.0.0.1:18848

  # ========== 数据源（dynamic-datasource 多数据源） ==========
  datasource:
    dynamic:
      # 默认数据源名（与下方 datasource.master 对应）
      primary: master
      datasource:
        master:
          # 逻辑库名，会拼进 url 占位符
          name: a-mao
          # JDBC 连接串：关闭 SSL、时区上海、允许公钥取回（MySQL 8 鉴权）
          url: jdbc:mysql://127.0.0.1:13306/${spring.datasource.dynamic.datasource.master.name}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          # MySQL 驱动类
          driver-class-name: com.mysql.cj.jdbc.Driver
          # 数据库账号（本地开发；生产须外置密钥，禁止入库）
          username: root
          # 数据库密码（本地开发；生产须外置密钥，禁止入库）
          password: 123456

  # ========== Redis（Spring Data 连接信息；会话/缓存实际经 Redisson） ==========
  data:
    redis:
      # Redis 主机
      host: 127.0.0.1
      # Redis 端口
      port: 6379
      # Redis DB 序号（多服务共享会话须同一 DB）
      database: 0
      # 命令/连接超时
      timeout: 10s
      ssl:
        # 本地开发关闭 TLS
        enabled: false

# ========== Redisson（分布式锁/缓存/客户端定制） ==========
redisson:
  # Redis key 统一前缀（空 = 不加前缀；多环境共用一库时建议加上）
  keyPrefix:
  # 业务线程池大小
  threads: 4
  # Netty IO 线程池大小
  nettyThreads: 8
  # 单机模式连接参数
  singleServerConfig:
    # 客户端名称（便于 Redis 侧 CLIENT LIST 排查）
    clientName: ${spring.application.name}
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池上限
    connectionPoolSize: 32
    # 连接空闲回收阈值（毫秒）
    idleConnectionTimeout: 10000
    # 单条命令等待超时（毫秒）
    timeout: 3000
    # 发布/订阅连接池大小
    subscriptionConnectionPoolSize: 50

# ========== Sa-Token（登录鉴权；与 system-service 同参以共享 Redis 会话） ==========
sa-token:
  # 令牌所在 Header 名
  token-name: Authorization
  # Header 里令牌前缀（调用方传 Authorization: Bearer <token>）
  token-prefix: Bearer
  # 不从 Cookie 读令牌
  is-read-cookie: false
  # 从 Header 读令牌
  is-read-header: true
  # 同一账号允许多处同时在线
  is-concurrent: true
  # 多端登录不共享同一 token（各自独立令牌）
  is-share: false
  # 令牌生成风格：uuid
  token-style: uuid
  # token 有效期（秒）= 7 天
  timeout: 604800
  # 无操作活跃超时（秒）；-1 表示关闭
  active-timeout: -1
  # 关闭 Sa-Token 内部日志（关键动作仍走业务日志）
  is-log: false

# 登录校验排除路径（Ant 风格；默认已含以下两项，取消注释可覆盖；配置契约只增不减）
# amao.satoken.exclude-paths:
#   - /api/auth/login   # 登录接口
#   - /api/rpc/**       # 内部 RPC（ADR-0001，本期无签名）
