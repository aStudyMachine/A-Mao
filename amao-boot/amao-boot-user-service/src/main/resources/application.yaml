server:
  port: 9101

spring:
  application:
    name: user-service
  config:
    import: "optional:nacos:user-service.yaml"
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  datasource:
    dynamic: # 多数据源配置
      primary: master
      datasource:
        master: # 数据源名称定义
          name: a-mao #数据库名称
          url: jdbc:mysql://127.0.0.1:13306/${spring.datasource.dynamic.datasource.master.name}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: root
          password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 10s
      ssl:
        enabled: false


# redisson 配置
redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 4
  # Netty线程池数量
  nettyThreads: 8
  # 单节点配置
  singleServerConfig:
    # 客户端名称
    clientName: ${spring.application.name}
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池大小
    connectionPoolSize: 32
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

# Sa-Token（决策7：Header Bearer，Redis 共享会话）
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-cookie: false
  is-read-header: true
  is-concurrent: true
  is-share: false
  token-style: uuid
  timeout: 604800
  active-timeout: -1
  is-log: false

# 登录校验排除路径（默认含 /api/auth/login、/api/rpc/**，可覆盖只增不减）
# amao.satoken.exclude-paths:
#   - /api/auth/login
#   - /api/rpc/**