# ========== 服务基础 ==========
server:
  # HTTP 监听端口（示例服务 8989）
  port: 8989

spring:
  application:
    # 应用名（示例服务）
    name: amao-example
  mvc:
    format:
      # 全局日期时间序列化格式（Controller 出入参）
      date-time: yyyy-MM-dd HH:mm:ss

  # ========== 数据源（dynamic-datasource 多数据源） ==========
  datasource:
    dynamic:
      # 默认数据源名（与下方 datasource.master 对应）
      primary: master
      datasource:
        master:
          # 逻辑库名，会拼进 url 占位符
          name: a-mao
          # JDBC 连接串：关闭 SSL、时区上海、允许公钥取回（MySQL 8 鉴权）
          url: jdbc:mysql://127.0.0.1:13306/${spring.datasource.dynamic.datasource.master.name}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          # MySQL 驱动类
          driver-class-name: com.mysql.cj.jdbc.Driver
          # 数据库账号（本地开发；生产须外置密钥，禁止入库）
          username: root
          # 数据库密码（本地开发；生产须外置密钥，禁止入库）
          password: 123456

  # ========== Redis（Spring Data 连接信息；会话/缓存实际经 Redisson） ==========
  data:
    redis:
      # Redis 主机
      host: 127.0.0.1
      # Redis 端口
      port: 6379
      # Redis DB 序号
      database: 0
      # 命令/连接超时
      timeout: 10s
      ssl:
        # 本地开发关闭 TLS
        enabled: false

# ========== Redisson（分布式锁/缓存/客户端定制） ==========
redisson:
  # Redis key 统一前缀（空 = 不加前缀）
  keyPrefix:
  # 业务线程池大小
  threads: 4
  # Netty IO 线程池大小
  nettyThreads: 8
  # 单机模式连接参数
  singleServerConfig:
    # 客户端名称（便于 Redis 侧 CLIENT LIST 排查）
    clientName: ${spring.application.name}
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池上限
    connectionPoolSize: 32
    # 连接空闲回收阈值（毫秒）
    idleConnectionTimeout: 10000
    # 单条命令等待超时（毫秒）
    timeout: 3000
    # 发布/订阅连接池大小
    subscriptionConnectionPoolSize: 50
