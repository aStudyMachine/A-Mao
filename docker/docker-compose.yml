# A-Mao 开发中间件（在 WSL 中启动：docker compose up -d）
# 端口/账号与各模块 application.yaml 保持一致，业务代码无需任何改动
#
# ===== 宿主端口的三条约定（改端口前必读）=====
# 1. 宿主端口可经项目根 .env 覆盖（MYSQL_HOST_PORT / REDIS_HOST_PORT /
#    NACOS_HTTP_PORT / NACOS_GRPC_PORT）。原因：端口在本机是否可用取决于
#    WinNAT/Hyper-V **动态**保留区间（踩坑 通-17/通-9），各设备不同，属机器
#    私有事实，不该硬编码进仓库。
# 2. 正常路径由 init.ps1 自项目根 .env 生成 docker/.env（本机私有，不入库），
#    compose 自动加载它；下面的 ${VAR:-默认} 默认值只作兜底（如手工直接 up）。
#    默认值定义点：scripts/local-env.ps1::Get-MiddlewareDefaultPorts。
# 3. 改宿主端口后必须 `docker compose up -d` 让容器**重建**（禁用 start/restart，
#    否则复用旧 HostConfig 仍绑旧端口，踩坑 通-7）。
services:
  mysql:
    image: mysql:8.0
    container_name: amao-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: a-mao
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化数据卷时自动执行建表脚本
      - ../sql/DDL.sql:/docker-entrypoint-initdb.d/01-DDL.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - amao-net

  redis:
    image: redis:7.4
    container_name: amao-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    command:
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - amao-net

  # Nacos 3.1.1 单机（与 spring-cloud-alibaba 2025.1.0.0 的 nacos-client 3.1.1 对齐）
  # 端口：18848 HTTP API（context /nacos）、19848 gRPC（=18848+1000）、8080 控制台
  # 宿主端口避开 Hyper-V/WinNAT 保留区间（如 9779-9878 覆盖 9848，曾致 gRPC 不可达），
  # 应用侧 server-addr 固定 127.0.0.1:18848（gRPC 端口 = server-addr 端口 + 1000）
  # 即使 NACOS_AUTH_ENABLE=false，镜像启动脚本仍强制要求 TOKEN/IDENTITY 三项（非空即可）
  # 开发默认关闭鉴权；生产必须开启鉴权并更换密钥
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: amao-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "QS1NYW8tTmFjb3MtRGV2LVNlY3JldC1LZXktMzJCLU1pbg=="
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
    ports:
      # 不变式：NACOS_GRPC_PORT = NACOS_HTTP_PORT + 1000（nacos-client 以
      # server-addr 端口 + 1000 连 gRPC）；错配会被 Get-MiddlewarePortConfigIssue 拦下。
      - "${NACOS_HTTP_PORT:-18848}:8848"
      - "${NACOS_GRPC_PORT:-19848}:9848"
      - "8080:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v3/console/health/readiness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - amao-net

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:

networks:
  amao-net:
    driver: bridge
