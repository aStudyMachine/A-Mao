# A-Mao 开发中间件（在 WSL 中启动：docker compose up -d）
# 端口/账号与各模块 application.yaml 保持一致，业务代码无需任何改动
services:
  mysql:
    image: mysql:8.0
    container_name: amao-mysql
    restart: unless-stopped
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: a-mao
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化数据卷时自动执行建表脚本
      - ../doc/DDL.sql:/docker-entrypoint-initdb.d/01-DDL.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - amao-net

  redis:
    image: redis:7.4
    container_name: amao-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - amao-net

  # Nacos 3.1.1 单机（与 spring-cloud-alibaba 2025.1.0.0 的 nacos-client 3.1.1 对齐）
  # 端口：8848 HTTP API（context /nacos）、9848 gRPC（=8848+1000）、8080 控制台
  # 即使 NACOS_AUTH_ENABLE=false，镜像启动脚本仍强制要求 TOKEN/IDENTITY 三项（非空即可）
  # 开发默认关闭鉴权；生产必须开启鉴权并更换密钥
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: amao-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "QS1NYW8tTmFjb3MtRGV2LVNlY3JldC1LZXktMzJCLU1pbg=="
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8080:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v3/console/health/readiness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - amao-net

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:

networks:
  amao-net:
    driver: bridge
